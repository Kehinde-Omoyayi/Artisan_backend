{% extends 'base.html' %}
{% block title %}Location · Artisan Market{% endblock %}
{% block content %}<section class="page-heading"><div><div class="eyebrow">Location</div><h1>{{ location.area }}</h1><p>{{ location.state }}, {{ location.country }}</p></div></section><section class="content-grid two"><article class="panel form-panel"><form method="post">{% include 'partials/form.html' %}<button class="button button-primary" type="submit">Save location</button></form></article><article class="panel"><form method="post" class="js-confirm-form" data-confirm="Delete this location? This uses the API DELETE endpoint.">{% csrf_token %}<input type="hidden" name="_delete" value="1"><button class="button button-danger" type="submit">Delete location</button></form></article></section>{% endblock %}
